project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "index.qmd"
    - "!**/quizzes/**/*.md"

website:
  title: "Intro252"
  navbar:
    left:
      - text: Sessions
        menu:
        # After teaching, change the session's output-file in its YAML to index_sol.html
        - text: 01 — Introduction
          href: sessions/01_intro/01_intro.qmd
        - text: 02 – Pragmatics
          href: sessions/02_pragmatics/02_pragmatics.qmd
        - text: 03 – Phonetics
          href: sessions/03_phonetics/03_phonetics.qmd
        - text: 04 – Phonology
          href: sessions/04_phonology/04_phonology.qmd
        - text: 05 — Syntax
          href: sessions/05_syntax/05_syntax.qmd
        - text: 07 — Morphology and word-formation
          href: sessions/07_morphology/07_morphology.qmd

format:
  html:
    theme: cosmo
    toc: true
    css: document.css
    fig-cap-location: top
    fig-align: center
    output-file: "index.html"
  clean-revealjs:
    slide-level: 2
    css:
      - slides.css
    fig-cap-location: top
    fig-align: center
    excalidraw:
      button: false
      shortcut: "`"
      theme: "light"
    output-file: "slides.html"

filters:
  - auto-dark
  - filters/strip-revealjs-html.lua
  - filters/solution-blocks.lua

revealjs-plugins:
  - pointer
  - excalidraw

bibliography: references.bib

# Project-wide metadata (available via {{< meta name >}})
metadata:
  linkprefix: ""

params:
  show_solutions: false