project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "index.qmd"
    - "!*.md"
  preview:
    port: 1860

website:
  title: "Intro252"
  navbar:
    left:
      - text: Sessions
        menu:
        - text: Introduction
          href: sessions/01_intro/website.html
        - text: Pragmatics
          href: sessions/02_pragmatics/website.html
        - text: Phonetics
          href: sessions/03_phonetics/website.html
        - text: Phonology
          href: sessions/04_phonology/website.html
        - text: Syntax
          href: sessions/05_syntax/website.html
        - text: Morphology and word-formation
          href: sessions/07_morphology/website.html
        - text: Semantics and lexicology
          href: sessions/09_semantics/website.html
        - text: Revision
          href: sessions/10_revision/website.html
        - text: Sociolinguistics
          href: sessions/11_sociolinguistics/website.html
        - text: History of English
          href: sessions/12_history-of-english/website.html

format:
  html:
    theme: cosmo
    toc: true
    css: document.css
    fig-cap-location: top
    fig-align: center
  clean-revealjs:
    slide-level: 2
    css:
      - slides.css
    fig-cap-location: top
    fig-align: center
    excalidraw:
      button: false
      shortcut: "`"
      theme: "light"

filters:
  - tikz
  - auto-dark
  - exclude
  - filters/strip-revealjs-html.lua

revealjs-plugins:
  - pointer
  - excalidraw

bibliography: references.bib

# Project-wide metadata (available via {{< meta name >}})
metadata:
  linkprefix: ""

params:
  show_excl: true