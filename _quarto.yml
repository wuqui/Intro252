project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "index.qmd"
    - "!**/quizzes/**/*.md"

website:
  title: "Intro252"
  navbar:
    left:
      - text: Sessions
        menu:
        - text: 01 – Introduction
          href: sessions/01_intro/website.html
        - text: 02 – Pragmatics
          href: sessions/02_pragmatics/website.html
        - text: 03 – Phonetics
          href: sessions/03_phonetics/website.html
        - text: 04 – Phonology
          href: sessions/04_phonology/website.html
        - text: 05 — Syntax
          href: sessions/05_syntax/website.html
        - text: 07 — Morphology and word-formation
          href: sessions/07_morphology/website.html
        - text: 09 — Semantics and lexicology
          href: sessions/09_semantics/website.html

format:
  html:
    theme: cosmo
    toc: true
    css: document.css
    fig-cap-location: top
    fig-align: center
  clean-revealjs:
    slide-level: 2
    css:
      - slides.css
    fig-cap-location: top
    fig-align: center
    excalidraw:
      button: false
      shortcut: "`"
      theme: "light"

filters:
  - auto-dark
  - exclude
  - filters/strip-revealjs-html.lua

revealjs-plugins:
  - pointer
  - excalidraw

bibliography: references.bib

# Project-wide metadata (available via {{< meta name >}})
metadata:
  linkprefix: ""

params:
  show_excl: true